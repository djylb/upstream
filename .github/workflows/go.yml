name: Go

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go: [ go.mod, stable ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: matrix.go == 'go.mod'
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-go@v7
        if: matrix.go != 'go.mod'
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test -race -count=1 ./...

  cross-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: go vet and test build for every target
        shell: bash
        run: |
          failed=()
          for target in \
            linux/386 linux/amd64 linux/arm linux/arm64 linux/mips linux/mipsle \
            linux/mips64 linux/riscv64 linux/loong64 linux/s390x linux/ppc64le \
            windows/386 windows/amd64 windows/arm64 \
            darwin/amd64 darwin/arm64 \
            freebsd/386 freebsd/amd64 freebsd/arm64 \
            openbsd/amd64 netbsd/amd64 dragonfly/amd64 \
            solaris/amd64 illumos/amd64 aix/ppc64 \
            android/arm64 ios/arm64 \
            js/wasm wasip1/wasm plan9/amd64
          do
            export GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0
            echo "::group::$target"
            if [ "$GOOS" = ios ]; then
              # ios binaries need cgo to link, so only vet it (vet needs no C compiler).
              CGO_ENABLED=1 go vet ./... || failed+=("$target")
            else
              { go vet ./... && go test -c -o /dev/null ./...; } || failed+=("$target")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::failed targets: ${failed[*]}"
            exit 1
          fi

  js-wasm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: go test on js/wasm under node
        # cross-vet only builds the tests; this runs them on the fake js network stack.
        run: PATH="$PATH:$(go env GOROOT)/lib/wasm" GOOS=js GOARCH=wasm go test -count=1 ./...

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt -l
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
